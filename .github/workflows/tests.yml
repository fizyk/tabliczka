name: Run tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions: {}

jobs:
  tests:
    uses: fizyk/actions-reuse/.github/workflows/shared-tests-pytests.yml@fda7c6236777ced9c8947ab7243959ee6aa185e9 # v5.10.3
    with:
      python-versions: '["3.15"]'
      dependency-manager: uv
  tests-windows:
    needs:
      - tests
    uses: fizyk/actions-reuse/.github/workflows/shared-tests-pytests.yml@fda7c6236777ced9c8947ab7243959ee6aa185e9 # v5.10.3
    with:
      python-versions: '["3.15"]'
      dependency-manager: uv
      os: windows-latest

name: Run tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions: {}

jobs:
  tests:
    # Written here until fizyk/actions-reuse can install the Qt system libraries: #21.
    runs-on: ubuntu-latest
    permissions:
      contents: read  # checkout only
    env:
      OS: ubuntu-latest
      PYTHON: '3.15'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the Qt system libraries
        run: >-
          sudo apt-get update &&
          sudo apt-get install --yes
          libegl1 libgl1 libxkbcommon0 libfontconfig1 libx11-6
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          python-version: '3.15'
      - name: Run tests
        run: uv run --locked pytest -v --cov --cov-report=xml
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          flags: unittests
          env_vars: OS,PYTHON
          fail_ci_if_error: false
  tests-windows:
    needs:
      - tests
    uses: fizyk/actions-reuse/.github/workflows/shared-tests-pytests.yml@fda7c6236777ced9c8947ab7243959ee6aa185e9 # v5.10.3
    with:
      python-versions: '["3.15"]'
      dependency-manager: uv
      os: windows-latest

name: Run tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions: {}

jobs:
  tests:
    uses: fizyk/actions-reuse/.github/workflows/shared-tests-pytests.yml@87d3ad31f48a10d47052242b0217dd49ddbfbc16 # v5.12.1
    with:
      python-versions: '["3.15"]'
      dependency-manager: uv
      apt-packages: libegl1 libgl1 libxkbcommon0 libfontconfig1 libx11-6
  tests-windows:
    needs:
      - tests
    uses: fizyk/actions-reuse/.github/workflows/shared-tests-pytests.yml@87d3ad31f48a10d47052242b0217dd49ddbfbc16 # v5.12.1
    with:
      python-versions: '["3.15"]'
      dependency-manager: uv
      os: windows-latest

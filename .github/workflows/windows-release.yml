name: Release Windows program

on:
  push:
    tags: [ 'v*' ]

permissions: {}

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: read  # checkout only; the build never sees a token that can write
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
      - name: Run tests
        run: uv run --locked --group windows pytest
      - name: Build the program
        run: >-
          uv run --locked --group windows pyinstaller
          --onefile --console --name tabliczka src/tabliczka/__main__.py
      - name: Run a drill with the program
        run: printf 'Ala\ndodawanie\nkoniec\n' | ./dist/tabliczka.exe
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tabliczka
          path: dist/tabliczka.exe
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write  # creates the GitHub Release and uploads the program to it
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: tabliczka
          path: dist
      - name: Take this version's changelog
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          awk -v header="tabliczka ${VERSION#v} " '
            index($0, header) == 1 { found = 1; next }
            found && /^tabliczka [0-9]/ { exit }
            found && !/^=+$/ { print }
          ' CHANGES.rst \
            | sed -E 's/`(#[0-9]+) <([^>]+)>`__/[\1](\2)/g' > release-notes.md
          test -s release-notes.md
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ github.ref_name }}
        run: >-
          gh release create "$VERSION" dist/tabliczka.exe
          --title "tabliczka ${VERSION#v}" --notes-file release-notes.md
